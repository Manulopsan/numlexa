name: numlexa_workspace
description: Monorepo de NUMLEXA. Raiz del workspace de pub; no se publica ni se importa.
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/numlexa_core
  - packages/numlexa_numbers
  - packages/numlexa_letters

dev_dependencies:
  melos: ^8.3.0
  lints: ^6.1.0

# Configuracion de Melos.
#
# OJO: Melos 8 lee su configuracion de ESTE fichero, bajo la clave `melos:`.
# Un `melos.yaml` en la raiz se ignora en silencio; se comprobo en F0.04.
# Los paquetes salen de la clave `workspace:` de arriba, no de una lista
# propia de Melos. `apps/mobile` se anade ahi en F5.01 (solo Android, D-15).
# Los scripts (`verify` = analyze + format + test) llegan en F0.07.
melos:
  ide:
    intellij:
      # Melos genera ficheros de IntelliJ por defecto. No se versionan y no
      # todo el mundo usa ese IDE: se desactivan en vez de ignorarlos.
      enabled: false

  scripts:
    test:
      description: >
        Ejecuta los tests de todos los paquetes con cobertura y comprueba el
        umbral del 90% que exige CLAUDE.md §7. Falla si algun paquete baja del
        umbral o si alguno no llega a producir informe.
      steps:
        - dart run melos exec --order-dependents -- dart test --coverage=coverage
        - dart run melos exec -- dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        - dart run scripts/check_coverage.dart

    format:
      description: >
        Comprueba el formato sin reescribir nada. Falla si algun fichero no
        esta formateado; para arreglarlo, `dart format .`.
      run: dart format --output=none --set-exit-if-changed .

    analyze:
      description: >
        Analisis estatico de todo el monorepo con las reglas de
        analysis_options.yaml. `--fatal-infos` y `--fatal-warnings` hacen
        bloqueante TODO, no solo lo que F0.05 elevo a `error`.
      run: dart analyze --fatal-infos --fatal-warnings .

    ignores:
      description: >
        Falla ante cualquier `// ignore:` sin comentario de justificacion
        encima. CLAUDE.md §7 lo prohibe y no hay lint que lo compruebe.
      run: dart run scripts/check_ignores.dart

    verify:
      description: >
        La puerta de entrada a cada commit (CLAUDE.md §2, paso 5):
        format + analyze + ignores + test con umbral de cobertura.
        Debe devolver 0 con el repositorio limpio.
      steps:
        - format
        - analyze
        - ignores
        - test
